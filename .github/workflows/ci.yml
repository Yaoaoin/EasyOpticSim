name: Validate EasyOpticSim
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/audit_public.py --self-test
      - run: python scripts/audit_public.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: cargo test -p easyoptics --locked --release
      - run: cargo check -p easyopticsim-desktop --locked
      - run: cargo test -p easyopticsim-desktop --locked --release
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build -p easyopticsim-cli --locked
      - run: cargo build -p easyopticsim-cli --locked --release
      - run: python -m pip install -r scripts/requirements-validation.txt
      - run: python scripts/validate_rayoptics.py
      - run: python scripts/validate_diffraction.py --extra-project examples/400mm-repaired.oos.json --output docs/validation-diffraction-open-source-1.0.json
      - run: python scripts/validate_mechanics.py
      - run: python scripts/validate_workflows.py
      - run: python scripts/validate_optimization.py
      - run: python scripts/validate_aiming.py
      - run: python scripts/validate_design.py
      - run: python scripts/validate_saved_design.py
      - run: python scripts/validate_coverage.py
      - run: python scripts/validate_motion.py
