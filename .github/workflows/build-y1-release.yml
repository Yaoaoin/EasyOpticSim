name: Build EasyOpticSim Y1.2 Windows release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit public source
        run: |
          python scripts/audit_public.py --self-test
          python scripts/audit_public.py
      - name: Test frontend
        run: pnpm test
      - name: Build frontend and offline manual
        run: pnpm build
      - name: Test Rust workspace
        run: cargo test --workspace --locked --release
      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build private-path-clean NSIS installer
        run: pnpm release:build
      - name: Stage and verify Y1.2 release assets
        run: python scripts/stage_release.py
      - name: Upload verified Y1.2 bundle
        uses: actions/upload-artifact@v4
        with:
          name: EasyOpticSim-Y1.2-Windows-release
          path: artifacts/release-Y1.2/
          if-no-files-found: error
          retention-days: 14
